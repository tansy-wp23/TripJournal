<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Travel journalling with photos, mood and health tracking.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="TripJournal">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>TripJournal</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    window.tripJournalGoogleMapsSdkState = 'unconfigured';

    (async () => {
      // Local/CI builds may generate the gitignored google_maps_config.json.
      // The committed token remains when that file is absent, so no-key builds
      // start normally without making a request to Google Maps.
      let googleMapsWebKey = '__GOOGLE_MAPS_WEB_KEY__';
      try {
        const response = await fetch('google_maps_config.json', {
          cache: 'no-store',
        });
        if (response.ok) {
          const config = await response.json();
          if (typeof config.GOOGLE_MAPS_WEB_KEY === 'string') {
            googleMapsWebKey = config.GOOGLE_MAPS_WEB_KEY;
          }
        }
      } catch (_) {
        // A missing local config is the supported no-key deployment.
      }

      const hasGoogleMapsWebKey =
        googleMapsWebKey.trim().length > 0 &&
        !googleMapsWebKey.startsWith('__GOOGLE_MAPS_');

      const startFlutter = () => {
        const bootstrap = document.createElement('script');
        bootstrap.src = 'flutter_bootstrap.js';
        bootstrap.async = true;
        document.body.appendChild(bootstrap);
      };

      if (!hasGoogleMapsWebKey) {
        startFlutter();
        return;
      }

      const maps = document.createElement('script');
      window.tripJournalGoogleMapsSdkState = 'loading';
      maps.src =
        'https://maps.googleapis.com/maps/api/js?key=' +
        encodeURIComponent(googleMapsWebKey);
      maps.onload = () => {
        if (window.google && window.google.maps) {
          window.tripJournalGoogleMapsSdkState = 'ready';
        } else {
          window.tripJournalGoogleMapsSdkState = 'failed';
        }
        startFlutter();
      };
      maps.onerror = () => {
        window.tripJournalGoogleMapsSdkState = 'failed';
        startFlutter();
      };
      document.head.appendChild(maps);
    })();
  </script>
</body>
</html>
